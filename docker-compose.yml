services:
  bambu-timelapse:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bambu-timelapse
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      TIMELAPSE_DIR: /data/timelapse
      DATABASE_PATH: /data/db/app.db
      WEB_DIST: /app/web/dist
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      # SQLite database
      - ./data/db:/data/db

      # Captured images and generated videos
      - ./data/timelapse:/data/timelapse
